services:
  api:
    build: .
    container_name: email_api
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      - JWT_SECRET=${JWT_SECRET:-change-this}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/test.db}
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=cache+memory://
      - REDIS_URL=redis://redis:6379/0
      - REDIS_WS_CHANNEL=ws_updates
    volumes:
      # Volume mapped for SQLite persistence 
      - app_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: email_worker
    command: celery -A celery_app.celery_app worker -l info
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/test.db}
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=cache+memory://
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - app_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: email_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: email_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  app_data:
  rabbitmq_data:
  redis_data: