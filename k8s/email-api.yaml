apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: email-api-argo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Eng-Omar-Hussein/The-Hook-Backend.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: email-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
